name: inventory-smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run inventory smoke test
        shell: pwsh
        run: ./tests/Test-InventorySmoke.ps1
